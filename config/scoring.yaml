# 医药政策雷达 · 评分配置
#
# 口径：国务院/部委发布的医药政策文件（含征求意见稿、执法处罚）及其落地。
# 分值 = 五个维度加总，满分 10。
#
# ⚠️ 评分 JSON 的字段被下游（pick/compose/claimcheck）锁死，这里是
#    "怎么给分"的说明，不要求模型回传每一项维度分（没有 dims 字段）。
score:
  dimensions:
    policy_level:
      label: 发文层级
      max: 3.0
      desc: 国务院/多部委联合=3；单一部委=2.5；部委司局/直属机构=1.5；地方省级=0.8；地方市级及以下=0.3
      note: 看发文机关层级，不看转发媒体。多部委联合发文取最高层级；"办公厅"算本级。
    impact:
      label: 影响范围
      max: 3.0
      desc: 全行业规则=3；单适应症/单品类/单环节=2；单企业=0.8；仅表述重申=0.3
      note: 问的是"整个行业怎么干"，还是"某类产品/某个环节"，还是"某一家企业"。
    force:
      label: 效力阶段
      max: 2.0
      desc: 已生效并执行=2；正式发布未生效=1.5；征求意见稿=1.0；吹风/规划/解读=0.5
      note: 征求意见稿不是已发布文件，任何情况下都不得按已生效打分。
    novelty:
      label: 增量
      max: 1.5
      desc: 首次明确/推翻既有规则/超预期=1.5；增量收紧=1.0；例行发布=0.4；纯重申=0
      note: 和既往文件比，新在哪里。纯转发、纯复述给 0。
    verifiability:
      label: 可核验性
      max: 0.5
      desc: 官方原文+文号+生效日期=0.5；只有官方通知摘要=0.3；只有媒体转述=0.1

  # 阈值
  #
  # 政策稿的分数天然比交易稿低（没有金额），不要用 BD 雷达的 8.0 去卡。
  # 6.0 的含义是"有一条实质性的政策变化，能写成 2200 字以上有信息量的稿"，
  # 不是凑数线；7.5 是"层级够高 + 有明确增量"，够格必发。
  must_publish: 7.5      # >= 必发
  keep: 6.0              # >= 进备选池，< 丢弃
  min_confidence: 0.5    # 置信度 < 0.5 不用

  # 每日篇数
  max_articles: 3
  # 同一 cluster_key（同一政策事件）最多展开几条，超过合并成一篇综述
  same_cluster_max: 3

  # 跨天去重：同一个政策事件在多少天内不重复写（跨来源/跨语种）
  cluster_lookback_days: 45

  # 政策保底：当天没有 >= keep 的条目时，若存在"部委级正式文件"，
  # 允许保底 1 篇，plan 里标 fallback: true。
  #
  # 判据直接取上面的维度档位：
  #   policy_level >= 2.5  = 单一部委及以上（国务院/多部委=3，单一部委=2.5）
  #   force        >= 1.5  = 正式发布（已生效执行 2.0 / 正式发布未生效 1.5），
  #                          征求意见稿 1.0 不够，吹风/解读 0.5 更不够
  #
  # ⚠️ 评分 JSON 没有 policy_level / force 数值字段（schema 被下游锁死），
  #    pick._policy_level() / pick._force() 用等价映射判定，映射关系见那两个函数：
  #    endpoint_verdict → force；flags(national/local/minor) + 发文机关正则 → policy_level。
  policy_fallback:
    enabled: true
    max_articles: 1
    min_policy_level: 2.5
    min_force: 1.5
    reason: 部委级正式文件保底
    # 海外（FDA/EMA/HHS/CMS）政策类文件：独立配额，不占国内名额。
    # 用户 2026-11-01：「国内 1-3 篇，国外 >7 分」。
    overseas_threshold: 7.0     # 海外达到这个分数即可加（默认 ≥7.0）
    overseas_strict: false      # true = 严格大于 threshold（7.1 起才加）
    overseas_max_articles: 1    # 每天最多加几篇海外

# 硬性排除（标题命中即在预筛阶段丢弃）
#
# ⚠️ 键名 `pure_financing` 是 BD 时代留下的，score._prefilter 只读这一个键——
#    改键名会让预筛静默失效（不报错，只是什么都不筛）。现语义＝非政策噪声。
exclude_keywords:
  pure_financing:
    - 招聘
    - 诚聘
    - 招贤
    - 招商加盟
    - 新品上市
    - 重磅上市
    - 会议通知
    - 培训班
    - 研修班
    - 任免
    - 任命
    - 免去
    - 辞职
    - 榜单
    - 排行榜
  stale:
    - 盘点
    - 回顾
    - 展望
    - 日历

# ===== LLM 配置 =====
# 支持 DeepSeek / MiniMax / 任意 OpenAI 兼容端点
# 环境变量（GitHub Secrets）：
#   LLM_API_KEY   统一用一个 key，切换 provider 时不用改代码
#   也可分别用 DEEPSEEK_API_KEY / MINIMAX_API_KEY

llm:
  provider: minimax_domestic    # deepseek | minimax | minimax_domestic
  fallback_providers: [deepseek_flash]   # 主用挂了自动切
  model: MiniMax-M3.1-Flash-Preview
  base_url: https://api.minimaxi.com/v1
  temperature: 0.3
  # ⚠️ MiniMax 的 max_tokens 含思考 token，设太小会返回空 content
  max_tokens: 16000
  # JSON 模式：DeepSeek 支持；MiniMax 文档未声明支持，
  # 设为 false 时靠 prompt 约束 + 鲁棒解析器兜底
  json_mode: false
  batch_size: 15          # 政策评分输出更长；30 条易触发 JSON 截断
  max_retries: 2

# 备选 provider 配置（改 llm.provider 后自动切换）
providers:
  # 2026-11-01 新增：备用 provider。MiniMax 429/超时/鉴权失败时，
  # score._client 会按下面的 fallback_providers 自动切到它。
  deepseek_flash:
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    max_tokens: 16000
    json_mode: true          # DeepSeek 支持 response_format；不支持时会自动降级
    env_key: DEEPSEEK_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    max_tokens: 8000
    json_mode: true
    env_key: DEEPSEEK_API_KEY
  minimax:
    base_url: https://api.minimax.io/v1
    model: MiniMax-M3.1-Flash-Preview
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY
  minimax_domestic:
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M2.7
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY
  # 生成专用：非推理模型，思考 token 为 0，长 HTML 结构更稳、速度快
  minimax_flash:
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M3.1-Flash-Preview
    max_tokens: 16000
    json_mode: false
    env_key: MINIMAX_API_KEY

# 生成用配置（与评分分开）
#
# ⚠️ 实测结论（2026-10-10，同一篇文章 A/B）：
#   内容/模板分离后，M2.7 全面优于 Flash：
#     M2.7  ：46s，3291 字符，结构完整（6小节/1表/4框/2脚注）
#     Flash ：113s，0 字符（空响应）
#   此前 M2.7 表现差，是因为它要同时写 HTML+CSS（格式负担）；
#   把标签和样式交给代码后，推理模型的优势就体现出来了。
gen_llm:
  provider: minimax_domestic
  fallback_providers: [deepseek_flash]   # 主用挂了自动切
  model: MiniMax-M2.7
  base_url: https://api.minimaxi.com/v1
  # M2.7 的 max_tokens 含思考 token；纯内容输出约 4500 token，
  # 32000 有充足余量（写 HTML 时代需要这么多，现在其实用不满）
  max_tokens: 32000
  temperature: 0.7
  json_mode: false