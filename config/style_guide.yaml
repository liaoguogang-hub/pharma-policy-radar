# 文章生成 Prompt 配置
# 关键：把实战踩过的坑全部编码进 prompt

# 铁律（违反即判定失败，触发重试）
hard_rules:
  html_structure: |
    【HTML 结构 — 最容易出错的地方】
    - 输出完整 <!DOCTYPE html> 开头
    - <p> 必须成对闭合：<p>文字</p>，漏掉 </p> 是最常见错误
    - <div> <td> <tr> <th> <li> 同样必须闭合
    - <style> 块必须完整包含所有类（见下方 CSS 模板），
      绝不允许输出空的 style 块或缺少类定义

  css_template: |
    【必须使用的 CSS 类】
    .kicker（栏目小字） .sub（副标题） .hook（红底白字钩子框）
    .box .box-t（四色提示框：.w琥珀 .g绿 .r红）
    table th td（深青表头+斑马纹） .m（等宽数字） .hl（红色强调）
    .foot（表下小字） .fn（脚注） .end（深色结语卡）
    h1 h2 h2 .n h3 body .wrap p

  content_rules: |
    【内容规范 — 政策口径，三段式，缺一段就是没写完】
    1) 文件说了什么：只写原文写明的内容。发文机关、文号、发布/生效日期、
       适用对象、关键条款，逐项落到具体表述，不要转述成自己的话，
       也不要补原文没有的修饰。
    2) 行业怎么解读：谁受影响、影响在哪一环、行业里已有的公开反应
       （具名协会/企业/专家表态）。这一段必须标明"这是解读"，
       不能写成文件的规定。
    3) 还没确定什么：执行细则、配套文件、过渡期、地方落地差异、
       口径待明确处。这一段是政策稿的价值所在，不许省略。
    - 金额、品种数、执行日期、覆盖范围等一切数字，必须有出处
      （文件名+条款号 / 官方答记者问 / 具名机构测算）；
      查不到就写"未找到公开数据"，禁止编造
    - 禁止把"征求意见稿"写成"已发布""将实施""新规来了"；
      必须写明"征求意见稿"以及意见反馈截止日期（若有）
    - 禁止推断文件没写的执行细节：谁执法、怎么罚、哪天开始按新规算，
      原文没写就不写
    - 开头必须有钩子：这份文件改的那一条，行业里眼下最疼的那一处
    - 每篇末尾必须有 <p class="fn"> 列出来源，逐条注明来源性质
      （官方原文 / 官方通知摘要 / 媒体转述 / 行业解读）

  style_rules: |
    【文风 — 大白话，不要 AI 味】
    - 用大白话，短句，不用长定语
    - 禁止：赋能、底层逻辑、抓手、护城河、值得注意的是、需要注意的是、
            综上所述、总而言之、不言而喻、至关重要、里程碑意义
    - 禁止"不是…而是…"排比句式
    - 禁止"本文将""本系列将""让我们"
    - 开头直接抛数字或场景，不要铺垫

# 禁止词（质检用）
banned_words:
  - 赋能
  - 底层逻辑
  - 抓手
  - 值得注意的是
  - 需要注意的是
  - 综上所述
  - 总而言之
  - 不言而喻
  - 至关重要
  - 具有里程碑意义
  - 本文将
  - 本系列将
  - 让我们
  - 值得注意的是

banned_patterns:
  # ⚠️ 正则必须【跨标点】匹配（2026-10-24 修正）
  #
  # 旧版写的是 '不是[^，。]{0,15}而是' —— 排除逗号，
  # 所以「不是 X，而是 Y」这种带逗号的形态（真实稿子里的绝大多数）
  # 一条都命中不了。后果：已发布 65 篇里有 59 篇带着这类句式，
  # 而质检从来没报过警。
  #
  # 正确写法：用 [^。；！？] 排除句号级标点，【保留逗号】。
  # 完整扫描器见 src/deai.py（跨标点 + 段落/句长分布）。
  - '不是[^。；！？]{0,30}?而是'
  - '不在于[^。；！？]{0,25}?而在于'
  - '不只是[^。；！？]{0,25}?(?:更是|也更是)'
  - '既[^。；！？]{0,12}?又[^。；！？]{0,12}?还'
  - '更重要的是'
  - '换句话说'
  - '也就是说'
  - '这意味着'
  - '归根结底'
  - '本质(?:上)?是'
  - '与其说'
  - '真正的'
  - '真正是'
  - '必须说清楚'
  - '绕不开'
  - '之所以'

# 四种文章类型的结构要求（政策口径）
#
# 四种类型的共同要求：
#   · 小节数 3-5
#   · 至少 1 张表（policy_review 至少 2 张：时间线 + 现行要求）
#   · 正文 2200-3200 字（不含表格和脚注）
#   · 必须引用官方原文的：发文机关、文号、发布/生效日期、适用对象、关键条款
#   · 禁止把"征求意见稿"当"已发布"写
#   · 禁止推断原文没写的执行细节
article_types:
  policy_readout:
    name: 单一政策解读
    structure: |
      1. 钩子：这份文件改了什么，一句话说清（用原文里的动作，不用评价）
      2. 文件要素表（表格）：发文机关 / 文号 / 发布日期 / 生效日期 /
         适用对象 / 关键条款
      3. 逐条拆关键条款：3-5 条，每条先引原文，再讲它改变了什么
      4. 谁受影响：企业 / 医疗机构 / 患者 / 地方主管部门，分对象写
      5. 还没确定什么：执行细则、配套文件、过渡期、口径待明确处
      要求：3-5 个小节；至少 1 张表；正文 2200-3200 字；
      必须引用官方原文的发文机关、文号、发布/生效日期、适用对象、关键条款。
      禁止把"征求意见稿"当"已发布"写；禁止推断原文没写的执行细节
      （谁执法、怎么罚、哪天开始按新规算，原文没写就不写）。

  consultation:
    name: 征求意见稿解读
    structure: |
      1. 钩子：征求意见稿要改的那条规则，和现行做法差在哪
      2. 要素表（表格）：起草机关 / 征求意见稿名称（有文号就写文号）/
         反馈截止日期 / 适用对象 / 拟改条款
      3. 为什么要改：官方起草说明里写的理由（没有就写"未找到公开说明"）
      4. 拟改条款逐条：原文 → 现行规则 → 差异（表格化对比）
      5. 还没确定什么：正式稿可能怎么变、反馈渠道、行业分歧
      要求：3-5 个小节；至少 1 张表；正文 2200-3200 字；
      必须引用官方原文的起草机关、征求意见稿名称、发布与反馈截止日期、
      适用对象、拟改关键条款。
      ⚠️ 全文口径必须停在"征求意见"：禁止写成"已发布""将实施""新规来了"；
      禁止推断正式稿会怎么写。

  enforcement:
    name: 执法处罚复盘
    structure: |
      1. 钩子：处罚的事实（谁、什么事、什么结果），不加形容词
      2. 案件要素表（表格）：处罚机关 / 决定书文号 / 被处罚主体 /
         违法事实 / 依据条款 / 处罚结果 / 决定日期
      3. 违反了哪一条：把依据条款的原文摆出来，再讲事实怎么对应上去
      4. 这类案子在监管里的位置：同类处罚的公开先例（有几件写几件，
         没有就写"未找到公开同类案例"）
      5. 还没确定什么：是否复议/诉讼、是否波及同类企业、后续专项检查
      要求：3-5 个小节；至少 1 张表；正文 2200-3200 字；
      必须引用官方原文的处罚机关、决定书文号、依据条款、处罚金额、决定日期。
      禁止把"立案调查"写成"已处罚"；禁止推断未公布的案情
      （主观故意、涉案批次、下游流向），没写就不写。

  policy_review:
    name: 多文件/时间线综述
    structure: |
      1. 钩子：一段时间里这条政策线变了什么（两个时间点对比，用文件里的原话）
      2. 时间线表（表格）：日期 / 发文机关 / 文件（文号）/ 核心变化
      3. 主线拆解：3-4 段，一段一个变化，每段都指回具体文件
      4. 现在的规则长什么样：把散在多个文件里的要求合成一张
         "现行要求表"（表格）
      5. 还没确定什么：下一份文件可能落在哪、执行层面的空白
      要求：3-5 个小节；至少 2 张表（时间线 + 现行要求）；正文 2200-3200 字；
      必须引用每份文件各自的发文机关、文号、发布/生效日期、适用对象；
      多份文件不得混成一份写。
      禁止把不同文件的条款合并成一条"新规"；禁止推断尚未发布文件的内容。

# 生成参数
generation:
  temperature: 0.7
  max_retries: 3           # 质检失败重试次数
  target_words: 3000
  # ⚠️ 容差放宽：模型在字数上很难精确命中，2250-3900 都算"3000字左右"。
  word_tolerance: 0.75
  max_words: 3900
  # AI 味词的容忍度：出现 1-2 次不触发重试
  #（实测"值得注意的是"单次出现就重写整篇，代价远大于收益，
  #  且重写后常引入新的字数/标签问题）
  ai_word_tolerate: 2
  ai_word_hard_limit: 5