# 医药政策雷达 · 源清单
#
# 口径：中国为主 + 海外重点。四类：
#   1) 中国监管（NMPA 公告通告 / 法规文件 / 政策解读，CDE 通知公告）
#   2) 医保与集采（国家医保局首页 / 政策法规，上海药事所 公告公示 / 国家集采）
#   3) 产业政策（中国政府网政策频道，工信部消费品工业司）
#   4) 海外重点（EMA news、FDA press、HHS newsroom；CMS 实测 403 标 blocked）
#
# access 分级（与 fetch.py 的调度一致）：
#   full     — 列表页可解析 + 文章页有正文
#   headline — 只能拿标题/摘要（正文在附件、需登录、或由 JS 渲染）
#   rss      — 走 RSS
#   blocked  — 站点直接拒绝（403/412/反爬 404），配置保留但不发请求
#   disabled — 站点可访问但内容不对口/无有效产出
#
# 本文件的每条 url / access / note 都是 2026-11-01 在本机（Windows，中国网络）实测的，
# 不是估的。复测方法：python src/probe_sources.py

version: 1

# ============ 采集行为 ============
fetch:
  # 每个源最多抓几篇正文（中文源 6-10，海外 4-6）。
  # 目的是控制单次运行的请求量：列表条目远多于额度，靠 _enrich_priority 排序取前 N。
  article_quota:
    nmpa_ggtg: 10
    nmpa_fgwj: 8
    nmpa_zhcjd: 6
    cde_news: 8
    nhsa_home: 10
    nhsa_fgk: 8
    smpaa_gggs: 10
    smpaa_jc: 6
    gov_zhengce: 6
    miit_xfpg: 6
    ema_news: 5
    fda_press: 6
    hhs_news: 4

  # 去文章页补全发布日期的上限（条）。
  # 本文件的列表页大多自带日期（span/URL/meta），真正需要逐篇探的很少。
  date_probe_limit: 120

  # 陈旧内容过滤的默认窗口（天）：只丢【已知日期且过旧】的条目，
  # 日期未知的保留（未知 ≠ 过旧）。
  #
  # 为什么是 45 而不是 BD 雷达的 21：政策文件的保鲜期比交易新闻长，
  # 一个 3 周前发布的指导原则仍值得写。单源可用 max_age_days 覆盖（见下）。
  max_age_days: 45

sources:
  # ============ 一、中国监管 ============
  # 三个 NMPA 栏目页结构一致：<div class="list"><ul><li><a title=...>标题</a>
  #   <span>(2026-10-29)</span></li>，日期在列表页就有，不需要逐篇探。
  - id: nmpa_ggtg
    name: 国家药监局 - 公告通告
    lang: cn
    url: https://www.nmpa.gov.cn/xxgk/ggtg/index.html
    mode: html
    access: full
    weight: 1.2
    topics: [nmpa, regulation, notice]
    note: |
      实测 200，20 条列表项，正文容器 div.text（公告正文 400-800 字）。
      注意同页还有"中药品种保护受理公示"（zwfw 路径），也是实质监管动态。

  - id: nmpa_fgwj
    name: 国家药监局 - 法规文件
    lang: cn
    url: https://www.nmpa.gov.cn/xxgk/fgwj/index.html
    mode: html
    access: full
    weight: 1.2
    topics: [nmpa, regulation, policy]
    note: |
      实测 200，20 条。含规范性文件/工作文件/批复，正文在 div.text。
      这是"审评审批改革、指导原则、管理办法"这类硬政策的主入口。

  - id: nmpa_zhcjd
    name: 国家药监局 - 政策解读
    lang: cn
    url: https://www.nmpa.gov.cn/xxgk/zhcjd/index.html
    mode: html
    access: full
    weight: 1.0
    topics: [nmpa, interpretation]
    # 政策解读更新慢（实测最新一条 2026-07-29），单独放宽陈旧窗口，
    # 否则天天 0 条——这是源本身的节奏，不是抓取失败。
    max_age_days: 150
    note: |
      实测 200，20 条。其中包括"图解政策"（图片型），正文可能不足 200 字，
      这类会降级成 headline，属正常。

  - id: cde_news
    name: 药审中心 CDE - 通知公告
    lang: cn
    url: https://www.cde.org.cn/
    mode: html
    access: full
    weight: 1.1
    topics: [cde, review, consultation]
    note: |
      ⚠️ CDE 是瑞数/通付盾 WAF：文章页（/main/news/viewInfoCommon/<id>）
      首次请求返回 HTTP 202 + JS 挑战页，同 client 带 cookie 重放一次即 200
      （fetch._get 里有 202 重试）。所以**不能**用无 cookie 的一次性请求。
      列表：首页 div.news_roll_module_title a（10 条滚动通知，含日期 20261030）。
      正文容器：div.news_detail_box；日期：<meta name="PubDate" content="20261023">。
      站内 JSON 接口没有采用——首页列表已经够新，且 202 重试比逆向接口稳。

  # ============ 二、医保与集采 ============
  - id: nhsa_home
    name: 国家医保局 - 首页
    lang: cn
    url: https://www.nhsa.gov.cn/
    mode: html
    access: full
    weight: 1.2
    topics: [nhsa, reimbursement, policy]
    note: |
      实测 200。首页 ul.localnews li a（约 115 条，含"政策法规/政策解读/地方动态"
      多个 tab），日期在 li 的 <span> 里。地方动态多，靠 RELEVANT + 陈旧过滤收口。

  - id: nhsa_fgk
    name: 国家医保局 - 政策法规
    lang: cn
    url: https://www.nhsa.gov.cn/col/col104/index.html
    mode: hanweb
    access: full
    weight: 1.3
    topics: [nhsa, reimbursement, policy]
    max_age_days: 150
    note: |
      该栏目是 Hanweb/TRS 的 jpage：列表由 dataproxy.jsp 异步取，HTML 里嵌着
      首屏 45 条 <record><![CDATA[<li>…]]></record>。fetch.py 的 hanweb 模式
      直接解析这段内嵌记录（0 条时回退 POST dataproxy.jsp），不需要浏览器。
      实测 200，45 条，最新 2026-09-15（政策文件本身低频，故 max_age_days 放宽）。
      ⚠️ 正文**不在文章页**：文章页只有元数据 + 附件下载链接（.txt/.wps），
      正文由 fetch.py 的附件回退去取 downfile.jsp 的 .txt（实测拿到 1898 字全文）。

  - id: smpaa_gggs
    name: 上海药事所 - 公告公示
    lang: cn
    url: https://www.smpaa.cn/xxgk/gggs/
    mode: html
    access: full
    weight: 1.2
    topics: [procurement, smpaa, policy]
    note: |
      实测 200，列表 a[href*='/xxgk/gggs/']，URL 自带日期
      （/xxgk/gggs/2026/10/30/25598.shtml），列表也有 <span>2026-10-30</span>。
      正文容器 div#content（类 content_con_cen docContent，746 字）。
      这是省级集采/挂网/中选结果的一手发布口。

  - id: smpaa_jc
    name: 上海药事所 - 国家组织药品集采
    lang: cn
    url: https://www.smpaa.cn/gjsdcg/
    mode: html
    access: full
    weight: 1.2
    topics: [procurement, vbp, policy]
    note: 实测 200，a[href*='/gjsdcg/'] 23 条，最新 2026-10-26。与 smpaa_gggs 互补。

  # ============ 三、产业政策 ============
  - id: gov_zhengce
    name: 中国政府网 - 政策
    lang: cn
    url: https://www.gov.cn/zhengce/
    mode: html
    access: full
    weight: 1.0
    topics: [statecouncil, policy]
    note: |
      实测 200，最新政策块 div.item03 div.list li a（8 条，日期在 <span>）。
      政策文件库 /zhengce/zhengceku/ 实测 403，不用。
      /zhengce/zuixin/ 是 JS 渲染（200 但正文列表为空），也不用。
      医药相关条目稀疏（本周只有《医疗康复护理扩容提升工程实施方案》批复），
      这是"国务院层级"的固有节奏，不是抓取问题。

  - id: miit_xfpg
    name: 工信部 - 消费品工业司（医药工业政策）
    lang: cn
    url: https://www.miit.gov.cn/jgsj/xfpgys/
    mode: html
    access: full
    weight: 1.1
    topics: [miit, industry, policy]
    max_age_days: 150
    note: |
      实测 200。列表 a[href*='/xfpgys/wjfb/'], a[href*='/xfpgys/gzdt/']（15 条，
      日期在 span.bt-list-time）。医药条目的主入口：医药工业"十五五"规划、
      鼓励仿制药品目录等。
      ⚠️ 文章页正文是 JS 渲染（页面里是 /api-gateway/jpaas-publish-server 的
      unit 挂载脚本），fetch.py 用同一个 CMS 的 unit 接口（tagId=文章正文）取正文，
      实测能拿到 602 字；纯 HTML 解析只会拿到 <meta name="Description"> 的 188 字。
      工信部文件低频，故 max_age_days 放宽。

  # ============ 四、海外重点 ============
  - id: ema_news
    name: EMA - News
    lang: en
    url: https://www.ema.europa.eu/en/news
    mode: html
    access: full
    weight: 1.0
    topics: [ema, eu, regulation]
    note: |
      实测 200（Chrome UA 即可）。列表 a[href*='/en/news/']（10 条），
      日期在卡片 metadata（"30 October 2026"），正文容器 article（约 500 字）。

  - id: fda_press
    name: FDA - Press Announcements
    lang: en
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
    mode: rss
    access: rss
    fetch_body: true
    ua: reader
    weight: 1.1
    topics: [fda, us, approval]
    note: |
      ⚠️ UA 决定成败（实测）：Chrome UA 下 fda.gov 全部返回
      HTTP 404 + /apology_objects/abuse-detection-apology.html（反爬拦截页），
      换阅读器 UA "Feedbin feed reader/1.0" 后 RSS 200 / 列表 200。
      所以本源在配置里写 ua: reader，fetch.py 按源覆盖 User-Agent。
      正确入口不是 /news-events/press-announcements（那个 404），
      而是上面这条 press-releases RSS（20 条，含标题+日期+摘要）。
      正文页同样要 reader UA（fetch_body: true）。

  - id: hhs_news
    name: HHS - Newsroom
    lang: en
    url: https://www.hhs.gov/news
    mode: html
    access: full
    ua: reader
    weight: 0.8
    topics: [hhs, us, policy]
    note: |
      实测：Chrome UA 403（Akamai），阅读器 UA 200（187KB）。
      列表 li.usa-collection__item h2 a（10 条），日期在 <time datetime>。
      正文容器 div.content（约 5,000 字）。HHS 稿件偏美国国内卫生政策，
      与医药直接相关的大约三成，其余靠 RELEVANT 过滤。

  - id: cms_newsroom
    name: CMS - Newsroom
    lang: en
    url: https://www.cms.gov/newsroom
    mode: html
    access: blocked
    weight: 0.0
    topics: [cms, us, reimbursement]
    note: |
      实测 403（Chrome / 阅读器 / Googlebot 三种 UA 全部 403，响应体 371-394 字节，
      是 Akamai 的拒绝页，不是挑战页）。同样 /newsroom/press-releases 也 403。
      按约定标 blocked，不再发请求。要用这条源需要代理或能过 Akamai 的出口 IP。

  # ============ 已确认不可达（保留记录，不再发请求）============
  - id: nhc_gov
    name: 国家卫生健康委
    lang: cn
    url: https://www.nhc.gov.cn/
    mode: html
    access: blocked
    weight: 0.0
    topics: [nhc, china, policy]
    note: |
      实测 412（Precondition Failed，站点按 UA/指纹拦爬），2026-11-01 复测仍是 412。
      标 blocked。需要换出口 IP 或走官方 RSS/接口才有戏。
