# 部署静态站点到 GitHub Pages
#
# 为什么单独一个 workflow：
#   医药政策雷达的**抓取在本机跑**（中国政府站只对国内网络友好：云端 runner
#   抓 NMPA 返回 412、医保局 ConnectTimeout；本机实测 13 源全部有产出）。
#   本机跑完把 site/ 提交推送，由这个 workflow 负责部署。
#
# 触发：push 到 main 且涉及 site/**；也支持手动。
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
